name: Package & Deploy Nuget Package

on:
  release:
    types: [published]

permissions:
  packages: write
  contents: read
  actions: read

jobs:
  create-package-artifact:
    uses: TheKingOfLettuce/LettuceGithubWorkflows/.github/workflows/Package-dotnet.yml@main
    with:
      dotnet-version: 10.0.x
      configuration: Release
      upload-artifact: true
      artifact-name: Lettuce.Log.Core_${{ github.ref_name }}
      bin-dir: Lettuce.Log.Core
      project-path: Lettuce.Log.Core/Lettuce.Log.Core.csproj
  deploy-package-github:
    uses: TheKingOfLettuce/LettuceGithubWorkflows/.github/workflows/Upload-Nuget-dotnet.yml@main
    needs: create-package-artifact
    with:
      artifact-name: Lettuce.Log.Core_${{ github.ref_name }}
      artifact-id: ${{ needs.create-package-artifact.outputs.artifact-id }}
      nuget-source: https://nuget.pkg.github.com/TheKingOfLettuce/index.json
    secrets:
      nuget-api-key: ${{ secrets.GITHUB_TOKEN }}
  # Trusted Publishing: the nuget.org policy must point at this file (Workflow File: Package.yml),
  # so the OIDC login and push run here rather than in the shared reusable workflow
  deploy-package-nuget:
    runs-on: ubuntu-latest
    needs: create-package-artifact
    permissions:
      id-token: write # allow GitHub to issue the OIDC token exchanged for a temporary NuGet API key
      contents: read
      actions: read
    steps:
    - name: Download Package Artifact
      uses: actions/download-artifact@v4
      id: download-package
      with:
        name: Lettuce.Log.Core_${{ github.ref_name }}

    - name: NuGet Login (OIDC -> temporary API key)
      uses: NuGet/login@v1
      id: login
      with:
        user: ${{ secrets.NUGET_USERNAME }}

    - name: Push Nuget Package
      run: dotnet nuget push "${{ steps.download-package.outputs.download-path }}/*.nupkg" --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json